<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottie Video Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d14;
      color: #e0e0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: #13131f;
      border-bottom: 1px solid #2a2a3e;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    .badge {
      background: #6c63ff; color: white; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .header-hint {
      margin-left: auto; font-size: 11px; color: #555577;
    }
    .header-hint a { color: #6c63ff; text-decoration: none; }
    .header-hint a:hover { text-decoration: underline; }

    .workspace { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 270px; background: #13131f; border-right: 1px solid #2a2a3e;
      overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px;
      flex-shrink: 0;
    }
    .panel { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; overflow: hidden; }
    .panel-header {
      padding: 7px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: #6666aa; border-bottom: 1px solid #2a2a3e;
    }
    .panel-body { padding: 12px; }

    .upload-zone {
      border: 2px dashed #3a3a5e; border-radius: 6px; padding: 16px;
      text-align: center; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #6c63ff; background: rgba(108,99,255,0.06);
    }
    .upload-zone.loaded { border-color: #4caf82; background: rgba(76,175,130,0.05); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 24px; margin-bottom: 4px; }
    .upload-label { font-size: 12px; font-weight: 600; color: #b0b0c8; }
    .upload-hint { font-size: 10px; color: #555577; margin-top: 2px; }
    .file-info { font-size: 10px; color: #4caf82; margin-top: 5px; word-break: break-all; }

    .btn {
      display: block; width: 100%; padding: 9px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary   { background: #6c63ff; color: white; }
    .btn-primary:hover:not(:disabled) { background: #7c73ff; }
    .btn-record    { background: #c62828; color: white; }
    .btn-record:hover:not(:disabled) { background: #d32f2f; }
    .btn-record.recording { animation: pulse-rec 1.4s infinite; }
    @keyframes pulse-rec { 0%,100% { background:#c62828; } 50% { background:#e53935; } }
    .btn-success   { background: #2e7d5e; color: white; }
    .btn-success:hover:not(:disabled) { background: #388e6e; }
    .btn-outline   { background: transparent; color: #b0b0c8; border: 1px solid #3a3a5e; }
    .btn-outline:hover:not(:disabled) { border-color: #6c63ff; color: #9a93ff; }

    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; font-size: 12px;
    }
    .setting-row label { color: #8888aa; }
    .setting-row select, .setting-row input[type="number"] {
      background: #0d0d14; border: 1px solid #3a3a5e; color: #e0e0f0;
      border-radius: 4px; padding: 3px 6px; font-size: 11px; width: 80px;
    }
    .volume-row {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: #666688; margin-top: 8px;
    }
    .volume-row input[type="range"] { flex: 1; accent-color: #6c63ff; }
    .audio-label {
      font-size: 10px; color: #4caf82; margin-top: 6px; padding: 5px 8px;
      background: rgba(76,175,130,0.08); border-radius: 4px; word-break: break-all; display: none;
    }
    .divider { height: 1px; background: #2a2a3e; margin: 6px 0; }
    .action-row { display: flex; flex-direction: column; gap: 7px; }

    /* ── Main ── */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .preview-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #0a0a10; position: relative; overflow: hidden;
    }
    .preview-placeholder { text-align: center; color: #2a2a45; pointer-events: none; }
    .preview-placeholder .icon { font-size: 56px; margin-bottom: 10px; }
    .preview-placeholder p { font-size: 13px; }

    #lottie-container {
      width: 100%; height: 100%; display: none;
      align-items: center; justify-content: center;
    }
    #lottie-container.visible { display: flex; }
    #lottie-container canvas { max-width: 100%; max-height: 100%; }

    .rec-indicator {
      display: none; position: absolute; top: 14px; right: 14px;
      align-items: center; gap: 6px;
      background: rgba(198,40,40,0.92); color: white;
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .rec-indicator.visible { display: flex; }
    .rec-dot {
      width: 7px; height: 7px; background: white; border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Transport bar ── */
    .transport-bar {
      background: #13131f; border-top: 1px solid #2a2a3e;
      padding: 10px 18px; flex-shrink: 0;
    }
    .progress-container { margin-bottom: 8px; }
    .progress-track {
      height: 5px; background: #2a2a3e; border-radius: 3px;
      overflow: hidden; cursor: pointer;
    }
    .progress-track:hover { height: 6px; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #6c63ff, #a89eff);
      width: 0%; transition: width 0.08s linear; border-radius: 3px;
    }
    .time-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #555577; margin-top: 3px;
    }
    .transport-controls { display: flex; align-items: center; gap: 6px; }
    .tbtn {
      background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 6px;
      color: #b0b0c8; padding: 5px 12px; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .tbtn:disabled { opacity: 0.35; cursor: not-allowed; }
    .tbtn:hover:not(:disabled) { border-color: #6c63ff; color: #9a93ff; }
    .tbtn.active { background: #6c63ff; border-color: #6c63ff; color: white; }
    .status-pill {
      margin-left: auto; font-size: 10px; padding: 3px 9px; border-radius: 20px;
      background: #1a1a2e; border: 1px solid #2a2a3e; color: #666688;
    }
    .status-pill.playing  { border-color: #6c63ff; color: #9a93ff; }
    .status-pill.recording{ border-color: #c62828; color: #e57373; }
    .status-pill.ready    { border-color: #4caf82; color: #4caf82; }
    .status-pill.done     { border-color: #ffa726; color: #ffa726; }
  </style>
</head>
<body>

<header>
  <span style="font-size:20px">🎬</span>
  <h1>Lottie Video Studio</h1>
  <div class="badge">Demo</div>
  <div class="header-hint">
    Need a sample? Try <a href="https://lottiefiles.com/featured" target="_blank" rel="noreferrer">LottieFiles.com</a>
  </div>
</header>

<div class="workspace">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar">

    <!-- Animation upload -->
    <div class="panel">
      <div class="panel-header">Animation (Lottie)</div>
      <div class="panel-body">
        <div class="upload-zone" id="lottie-zone">
          <input type="file" id="lottie-file" accept=".json">
          <div class="upload-icon">✦</div>
          <div class="upload-label">Drop Lottie JSON</div>
          <div class="upload-hint">or click to browse</div>
          <div class="file-info" id="lottie-info"></div>
        </div>
      </div>
    </div>

    <!-- Audio upload -->
    <div class="panel">
      <div class="panel-header">Music / Audio</div>
      <div class="panel-body">
        <div class="upload-zone" id="audio-zone">
          <input type="file" id="audio-file" accept="audio/*">
          <div class="upload-icon">♫</div>
          <div class="upload-label">Drop Audio File</div>
          <div class="upload-hint">MP3 · WAV · OGG · M4A</div>
          <div class="file-info" id="audio-info"></div>
        </div>
        <div class="audio-label" id="audio-label"></div>
        <div class="volume-row">
          <span>Vol</span>
          <input type="range" id="volume" min="0" max="100" value="80">
          <span id="vol-val">80%</span>
        </div>
      </div>
    </div>

    <!-- Export settings -->
    <div class="panel">
      <div class="panel-header">Export Settings</div>
      <div class="panel-body">
        <div class="setting-row">
          <label>Frame rate</label>
          <select id="fps">
            <option value="24">24 fps</option>
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </div>
        <div class="setting-row">
          <label>Quality</label>
          <select id="quality">
            <option value="2500000">Low</option>
            <option value="5000000" selected>Medium</option>
            <option value="8000000">High</option>
          </select>
        </div>
        <div class="setting-row">
          <label>Format</label>
          <select id="format" disabled>
            <option value="webm">WebM</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="panel">
      <div class="panel-header">Actions</div>
      <div class="panel-body action-row">
        <button class="btn btn-record" id="record-btn" disabled>● Start Recording</button>
        <button class="btn btn-outline" id="stop-btn"   disabled>■ Stop Recording</button>
        <div class="divider"></div>
        <button class="btn btn-success" id="dl-btn" disabled>↓ Download Video</button>
      </div>
    </div>

  </aside>

  <!-- ── Main area ──────────────────────────────────────── -->
  <main class="main-area">
    <div class="preview-area">
      <div class="preview-placeholder" id="placeholder">
        <div class="icon">🎞️</div>
        <p>Load a Lottie JSON file to preview</p>
      </div>
      <div id="lottie-container"></div>
      <div class="rec-indicator" id="rec-ind">
        <div class="rec-dot"></div> REC
      </div>
    </div>

    <!-- Transport bar -->
    <div class="transport-bar">
      <div class="progress-container">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-labels">
          <span id="t-cur">0:00</span>
          <span id="t-tot">0:00</span>
        </div>
      </div>
      <div class="transport-controls">
        <button class="tbtn" id="play-btn"  disabled>▶ Play</button>
        <button class="tbtn" id="pause-btn" disabled>⏸ Pause</button>
        <button class="tbtn" id="reset-btn" disabled>⏹ Reset</button>
        <div class="status-pill" id="status">No file loaded</div>
      </div>
    </div>
  </main>

</div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────────
let anim        = null;
let animDurSec  = 0;
let audioEl     = null;
let audioCtx    = null;
let audioSrc    = null;
let recorder    = null;
let chunks      = [];
let downloadBlob= null;
let recording   = false;
let ticker      = null;

// ─── Element refs ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const lottieZone  = $('lottie-zone');
const audioZone   = $('audio-zone');
const container   = $('lottie-container');
const placeholder = $('placeholder');
const recInd      = $('rec-ind');
const fill        = $('progress-fill');
const tCur        = $('t-cur');
const tTot        = $('t-tot');
const status      = $('status');
const lottieInfo  = $('lottie-info');
const audioInfo   = $('audio-info');
const audioLabel  = $('audio-label');
const volSlider   = $('volume');
const volVal      = $('vol-val');
const playBtn     = $('play-btn');
const pauseBtn    = $('pause-btn');
const resetBtn    = $('reset-btn');
const recordBtn   = $('record-btn');
const stopBtn     = $('stop-btn');
const dlBtn       = $('dl-btn');

// ─── Lottie loading ────────────────────────────────────────────────────────────
$('lottie-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) readLottieFile(f);
});

setupDrop(lottieZone, f => readLottieFile(f));

function readLottieFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      loadLottie(JSON.parse(ev.target.result), file.name);
    } catch {
      alert('Invalid Lottie JSON file.');
    }
  };
  reader.readAsText(file);
}

function loadLottie(data, name) {
  if (anim) { anim.destroy(); anim = null; }
  container.innerHTML = '';
  container.classList.add('visible');
  placeholder.style.display = 'none';

  const fr = data.fr || 30;
  animDurSec = ((data.op || 0) - (data.ip || 0)) / fr;

  anim = lottie.loadAnimation({
    renderer: 'canvas',
    container,
    loop: false,
    autoplay: false,
    animationData: data,
    rendererSettings: { clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' }
  });

  anim.addEventListener('complete', onComplete);

  lottieInfo.textContent = '✓ ' + name;
  lottieZone.classList.add('loaded');
  tTot.textContent = fmt(animDurSec);
  tCur.textContent = '0:00';
  fill.style.width = '0%';

  setTransport(true);
  recordBtn.disabled = false;
  setStatus('ready', 'Ready');
}

// ─── Audio loading ─────────────────────────────────────────────────────────────
$('audio-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadAudio(f);
});

setupDrop(audioZone, f => loadAudio(f));

function loadAudio(file) {
  // Tear down previous audio context so we can reconnect
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; audioSrc = null; }
  if (audioEl) { audioEl.pause(); URL.revokeObjectURL(audioEl.src); }

  audioEl = new Audio(URL.createObjectURL(file));
  audioEl.volume = volSlider.value / 100;

  audioEl.addEventListener('loadedmetadata', () => {
    const dur = fmt(audioEl.duration);
    audioInfo.textContent = `✓ ${file.name}`;
    audioLabel.textContent = `♫  ${file.name}  —  ${dur}`;
    audioLabel.style.display = 'block';
  });

  audioZone.classList.add('loaded');
}

// ─── Volume ────────────────────────────────────────────────────────────────────
volSlider.addEventListener('input', () => {
  volVal.textContent = volSlider.value + '%';
  if (audioEl) audioEl.volume = volSlider.value / 100;
});

// ─── Transport ─────────────────────────────────────────────────────────────────
playBtn.addEventListener('click', () => {
  if (!anim) return;
  anim.play();
  if (audioEl) audioEl.play().catch(() => {});
  setStatus('playing', '▶ Playing');
  startTicker();
});

pauseBtn.addEventListener('click', () => {
  if (!anim) return;
  anim.pause();
  if (audioEl) audioEl.pause();
  setStatus('ready', 'Paused');
  stopTicker();
});

resetBtn.addEventListener('click', () => {
  resetPlayback();
  setStatus('ready', 'Reset');
});

// ─── Progress bar seek ─────────────────────────────────────────────────────────
$('progress-track').addEventListener('click', e => {
  if (!anim || recording) return;
  const pct = (e.clientX - e.currentTarget.getBoundingClientRect().left) / e.currentTarget.offsetWidth;
  const frame = Math.round(pct * anim.totalFrames);
  anim.goToAndStop(frame, true);
  if (audioEl && isFinite(audioEl.duration)) audioEl.currentTime = pct * audioEl.duration;
  updateProgress();
});

// ─── Recording ─────────────────────────────────────────────────────────────────
recordBtn.addEventListener('click', startRecording);
stopBtn.addEventListener('click',   stopRecording);

async function startRecording() {
  if (!anim) { alert('Load a Lottie file first.'); return; }

  resetPlayback();
  await delay(80);

  const canvas = container.querySelector('canvas');
  if (!canvas) { alert('Render canvas not found — try reloading the animation.'); return; }

  const fps     = parseInt($('fps').value);
  const bitrate = parseInt($('quality').value);

  // --- video stream ---
  const videoStream = canvas.captureStream(fps);
  const allTracks = [...videoStream.getVideoTracks()];

  // --- audio stream ---
  if (audioEl && audioEl.src) {
    try {
      if (audioCtx) { await audioCtx.close().catch(() => {}); }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      audioSrc = audioCtx.createMediaElementSource(audioEl);
      const dest = audioCtx.createMediaStreamDestination();
      audioSrc.connect(dest);
      audioSrc.connect(audioCtx.destination); // also hear it
      allTracks.push(...dest.stream.getAudioTracks());
    } catch (err) {
      console.warn('Audio capture skipped:', err.message);
    }
  }

  const stream   = new MediaStream(allTracks);
  const mimeType = bestMime();

  try {
    recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: bitrate });
  } catch {
    recorder = new MediaRecorder(stream);
  }

  chunks = [];
  downloadBlob = null;
  dlBtn.disabled = true;
  dlBtn.textContent = '↓ Download Video';

  recorder.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
  recorder.onstop = finishRecording;

  recorder.start(100);
  recording = true;

  recInd.classList.add('visible');
  recordBtn.classList.add('recording');
  recordBtn.disabled = true;
  stopBtn.disabled = false;
  setTransport(false);
  setStatus('recording', '● Recording');

  anim.goToAndPlay(0, true);
  if (audioEl) { audioEl.currentTime = 0; audioEl.volume = volSlider.value / 100; audioEl.play().catch(() => {}); }
  startTicker();
}

function stopRecording() {
  if (recorder?.state !== 'inactive') recorder.stop();
  recording = false;
  stopTicker();
  if (audioEl) audioEl.pause();

  recInd.classList.remove('visible');
  recordBtn.classList.remove('recording');
  recordBtn.disabled = false;
  stopBtn.disabled = true;
  setTransport(true);
}

function finishRecording() {
  const mime = bestMime();
  downloadBlob = new Blob(chunks, { type: mime });
  const mb = (downloadBlob.size / 1024 / 1024).toFixed(2);
  dlBtn.disabled = false;
  dlBtn.textContent = `↓ Download Video (${mb} MB)`;
  setStatus('done', `Done — ${mb} MB`);
}

function onComplete() {
  stopTicker();
  fill.style.width = '100%';
  tCur.textContent = fmt(animDurSec);
  if (audioEl) audioEl.pause();
  if (recording) setTimeout(stopRecording, 250);
  else setStatus('ready', 'Finished');
}

// ─── Download ──────────────────────────────────────────────────────────────────
dlBtn.addEventListener('click', () => {
  if (!downloadBlob) return;
  const ext = bestMime().includes('mp4') ? 'mp4' : 'webm';
  const url = URL.createObjectURL(downloadBlob);
  const a = Object.assign(document.createElement('a'), { href: url, download: `lottie-${Date.now()}.${ext}` });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 8000);
});

// ─── Progress ticker ───────────────────────────────────────────────────────────
function startTicker() {
  stopTicker();
  ticker = setInterval(updateProgress, 100);
}
function stopTicker() { clearInterval(ticker); ticker = null; }

function updateProgress() {
  if (!anim || animDurSec <= 0) return;
  const pct = anim.totalFrames > 0 ? anim.currentFrame / anim.totalFrames : 0;
  fill.style.width = (pct * 100).toFixed(1) + '%';
  tCur.textContent = fmt(animDurSec * pct);
}

// ─── Helpers ───────────────────────────────────────────────────────────────────
function resetPlayback() {
  if (anim) anim.goToAndStop(0, true);
  if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
  fill.style.width = '0%';
  tCur.textContent = '0:00';
  stopTicker();
}

function setTransport(on) {
  playBtn.disabled = !on;
  pauseBtn.disabled = !on;
  resetBtn.disabled = !on;
}

function setStatus(type, text) {
  status.className = 'status-pill ' + type;
  status.textContent = text;
}

function fmt(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function bestMime() {
  const candidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  return candidates.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function setupDrop(zone, onFile) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}
</script>
</body>
</html>
